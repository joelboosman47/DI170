<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Challenge: Create a solar system</title>
    <style>
        body {
            background-color: black;
            padding: 10px;
        }

        .planet {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            text-align: center;
            padding: 10px;
            position: relative;
            border: 2px solid white;
        }

        .moon {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgb(237, 237, 237);
            border: 5px solid red;
        }

        /* Sun - yellow */
        .planet-0 {
            background-color: #FDB813;
        }

        /* Earth - blue */
        .planet-1 {
            background-color: #4A90E2;
        }

        /* Mercury - brown/gray */
        .planet-2 {
            background-color: #835b5b;
        }

        /* Mars - red */
        .planet-3 {
            background-color: #e25858;
        }

        /* Saturn - pale yellow */
        .planet-4 {
            background-color: #fbe29f;
        }
    </style>
</head>

<body>

    <section class="listPlanets"></section>

    <script src="script.js"></script>
</body>

</html>
