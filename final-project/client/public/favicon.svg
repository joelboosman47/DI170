<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Soft background so it reads on light & dark tab bars -->
  <rect width="32" height="32" rx="6" fill="#f0fdfa"/>

  <!-- Grid lines -->
  <path stroke="#134e4a" stroke-width="1.75" stroke-linecap="round"
        d="M11.5 4.5v23M20.5 4.5v23M4.5 11.5h23M4.5 20.5h23"/>

  <!-- X (top-left) — teal -->
  <path stroke="#0f766e" stroke-width="2.25" stroke-linecap="round"
        d="M5.75 5.75l4.5 4.5M10.25 5.75l-4.5 4.5"/>

  <!-- O (center) — warm orange -->
  <circle cx="16" cy="16" r="2.75" stroke="#c2410c" stroke-width="2.25"/>

  <!-- X (bottom-right) — teal -->
  <path stroke="#0f766e" stroke-width="2.25" stroke-linecap="round"
        d="M21.75 21.75l4.5 4.5M26.25 21.75l-4.5 4.5"/>
</svg>
