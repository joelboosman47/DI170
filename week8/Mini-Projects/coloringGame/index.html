<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Coloring Squares</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="controls">
        <h1><span style="color: #e74c3c;">C</span><span style="color: #e67e22;">o</span><span
                style="color: #f1c40f;">l</span><span style="color: #2ecc71;">o</span><span
                style="color: #3498db;">r</span><span style="color: #9b59b6;">i</span><span
                style="color: #e91e63;">n</span><span style="color: #1abc9c;">g</span> Squares</h1>

        <div class="palette-grid">
            <button class="reset-btn" id="resetBtn">Clear</button>
            <button class="color-btn active" style="background: #333333;" data-color="#333333"></button>
            <button class="color-btn" style="background: #ffffff; border: 1px solid #ccc;"
                data-color="#ffffff"></button>
            <button class="color-btn" style="background: #95a5a6;" data-color="#95a5a6"></button>
            <button class="color-btn" style="background: #e74c3c;" data-color="#e74c3c"></button>
            <button class="color-btn" style="background: #e91e63;" data-color="#e91e63"></button>
            <button class="color-btn" style="background: #ff1493;" data-color="#ff1493"></button>
            <button class="color-btn" style="background: #e67e22;" data-color="#e67e22"></button>
            <button class="color-btn" style="background: #f1c40f;" data-color="#f1c40f"></button>
            <button class="color-btn" style="background: #8b4513;" data-color="#8b4513"></button>
            <button class="color-btn" style="background: #32cd32;" data-color="#32cd32"></button>
            <button class="color-btn" style="background: #2ecc71;" data-color="#2ecc71"></button>
            <button class="color-btn" style="background: #1abc9c;" data-color="#1abc9c"></button>
            <button class="color-btn" style="background: #008080;" data-color="#008080"></button>
            <button class="color-btn" style="background: #3498db;" data-color="#3498db"></button>
            <button class="color-btn" style="background: #9b59b6;" data-color="#9b59b6"></button>
            <button class="color-btn random-btn" id="randomBtn"></button>
        </div>

        <div class="magic-wrapper">
            <span class="switch-label">Magic!</span>
            <label class="switch">
                <input type="checkbox" id="magicToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="canvas-container">
        <div id="drawingGrid"></div>
    </div>
    <canvas id="canvas"></canvas>
</body>

</html>
