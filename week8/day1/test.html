<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Banner</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .banner h1 {
            margin: 0;
            font-size: 2.5em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 4px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            font-size: 1em;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }

        button:hover {
            background-color: #764ba2;
        }
    </style>
</head>

<body>
    <div class="input-group">
        <input type="text" id="bannerText" placeholder="Enter your banner text..." value="Welcome to My Banner!">
        <button onclick="updateBanner()">Update Banner</button>
    </div>

    <div class="banner" hidden>
        <h1 id="bannerContent">Welcome to My Banner!</h1>
    </div>

    <script>
        function updateBanner() {
            const text = document.getElementById('bannerText').value;
            document.getElementById('bannerContent').textContent = text;
        }

        // Update banner when Enter key is pressed
        document.getElementById('bannerText').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                updateBanner();
            }
        });

        const banner = document.getElementsByClassName("banner")[0];

        setTimeout(() => { banner.removeAttribute("hidden") }, 5000);

    </script>
</body>

</html>
