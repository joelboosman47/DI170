<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 1</title>
</head>

<body>
    <table id="sampleTable" border="1">
        <tr>
            <td>Row1 cell1</td>
            <td>Row1 cell2</td>
        </tr>
        <tr>
            <td>Row2 cell1</td>
            <td>Row2 cell2</td>
        </tr>
    </table>

    <input type="button" onclick="insertRow()" onmouseover="po" value="Insert row">
    <script>
        let tableIndex = 2;
        function insertRow() {
            tableIndex++;
            let table = document.getElementById("sampleTable");
            let tbody = table.querySelector("tbody") || table;
            let newRow = tbody.insertRow();
            let cell1 = newRow.insertCell();
            let cell2 = newRow.insertCell();
            cell1.textContent = "Row" + tableIndex + " cell1";
            cell2.textContent = "Row" + tableIndex + " cell2";
        }
    </script>
</body>

</html>
